version: "3.8"

services:
  # ============================================================================
  # TAILSCALE: Encrypted Zero-Trust Mesh VPN Sidecar
  # Routes all external family traffic over WireGuard without open router ports.
  # Publishes port 2283 so immich-server (running in tailscale's network) is reachable
  # via MagicDNS (http://picloud-photos:2283) AND local LAN (port 2283).
  # ============================================================================
  tailscale:
    container_name: immich_tailscale
    image: tailscale/tailscale:latest
    hostname: picloud-photos
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:-}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_EXTRA_ARGS=--reset
    volumes:
      - tailscale-state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    ports:
      # Bind port 2283 on host LAN and Tailscale mesh
      - "${LOCAL_LAN_IP:-0.0.0.0}:2283:2283"
    restart: always

  # ============================================================================
  # IMMICH SERVER: Application Backend & Web UI
  # Runs inside Tailscale's network namespace (network_mode: service:tailscale)
  # This guarantees MagicDNS http://picloud-photos:2283 routes directly to Immich!
  # ============================================================================
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-v1.121.0}
    network_mode: "service:tailscale"
    volumes:
      - ${UPLOAD_LOCATION}:/usr/src/app/upload
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    environment:
      - DB_HOSTNAME=database
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_DATABASE_NAME=${DB_DATABASE_NAME}
      - REDIS_HOSTNAME=redis
    depends_on:
      - tailscale
      - redis
      - database
    restart: always
    healthcheck:
      disable: false

  # ============================================================================
  # MACHINE LEARNING: Facial Recognition, Smart Search & Geocoding
  # Resource-constrained for Raspberry Pi 4/5 (Cortex-A72/A76) stability.
  # ============================================================================
  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-v1.121.0}
    volumes:
      - model-cache:/cache
    env_file:
      - .env
    environment:
      - MACHINE_LEARNING_WORKERS=${IMMICH_MACHINE_LEARNING_WORKERS:-1}
      - MACHINE_LEARNING_INTER_OP_THREADS=${IMMICH_MACHINE_LEARNING_INTER_OP_THREADS:-1}
      - MACHINE_LEARNING_INTRA_OP_THREADS=${IMMICH_MACHINE_LEARNING_INTRA_OP_THREADS:-2}
    deploy:
      resources:
        limits:
          memory: 2048M
    restart: always
    healthcheck:
      disable: false

  # ============================================================================
  # REDIS: In-Memory Message Broker & Microservice Queues
  # Internal network only: Never exposed outside container bridge
  # ============================================================================
  redis:
    container_name: immich_redis
    image: docker.io/redis:6.2-alpine@sha256:84882e870547319cf8186eb83ff4b1031b7b7ec37e45f254132bda3a7ff76da9
    healthcheck:
      test: cmd redis-cli ping || exit 1
    restart: always

  # ============================================================================
  # POSTGRESQL + PGVECTO-RS: Vector Database & Metadata Storage
  # ============================================================================
  database:
    container_name: immich_postgres
    image: docker.io/tensorchord/pgvecto-rs:pg14-v0.2.1@sha256:90724186f0a3517cf6914295b5ab03d7372a92907c030a534cca479b7b365212
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready --dbname="${DB_DATABASE_NAME}" --username="${DB_USERNAME}" || exit 1; Chksum="$$(psql --dbname="${DB_DATABASE_NAME}" --username="${DB_USERNAME}" --tuples-only --no-align --command='SELECT COALESCE(SUM(checksum_failures), 0) FROM pg_stat_database')"; test "$$Chksum" ='0' || exit 1
      interval: 5m
      start_interval: 30s
      start_period: 5m
      timeout: 15s
      retries: 5
    restart: always

volumes:
  model-cache:
  tailscale-state:
